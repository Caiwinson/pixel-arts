[package]
# The name of your binary. Running `cargo build` will produce `pixel-render`
name = "pixel-render"
version = "0.1.0"
# Rust edition — always use 2021 for new projects
edition = "2021"

[dependencies]
# `png` handles both encoding (final output) and decoding (the baked-in
# plot.png overlay, decoded once via OnceLock at first use).
png = "0.17"